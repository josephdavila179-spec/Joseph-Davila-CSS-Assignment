<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Puzzle Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="info">
        <h1>My Flexbox Puzzle</h1>
        <p>Name: Joseph Davila</p>
        <p>Puzzle Choice: Butterflies </p>
    </header>

    <main>
        <section class="puzzle-section">
            <h2>My Completed Puzzle</h2>

            <div class="puzzle">

                <!-- Column 1 -->
                <div class="column">
                    <img src="images/1G.jpg" alt="Puzzle piece 1G">
                    <img src="images/1P.jpg" alt="Puzzle piece 1P">
                    <img src="images/1E.jpg" alt="Puzzle piece 1E">
                    <img src="images/1F.jpg" alt="Puzzle piece 1F">
                </div>

                <!-- Column 2 -->
                <div class="column">
                    <img src="images/1A.jpg" alt="Puzzle piece 1A">
                    <img src="images/1B.jpg" alt="Puzzle piece 1B">
                    <img src="images/1N.jpg" alt="Puzzle piece 1N">
                    <img src="images/1L.jpg" alt="Puzzle piece 1L">
                </div>

                <!-- Column 3 -->
                <div class="column">
                    <img src="images/1J.jpg" alt="Puzzle piece 1J">
                    <img src="images/1H.jpg" alt="Puzzle piece 1H">
                    <img src="images/1C.jpg" alt="Puzzle piece 1C">
                    <img src="images/1K.jpg" alt="Puzzle piece 1K">
                </div>

                <!-- Column 4 -->
                <div class="column">
                    <img src="images/1Q.jpg" alt="Puzzle piece 1Q">
                    <img src="images/1M.jpg" alt="Puzzle piece 1M">
                    <img src="images/1O.jpg" alt="Puzzle piece 1O">
                    <img src="images/1I.jpg" alt="Puzzle piece 1I">
                </div>

                <!-- Extra piece that must be hidden -->
                <img class="imposter" src="images/1D.jpg"
                     alt="Extra puzzle piece">

            </div>
        </section>
    </main>

    <footer class="date">
        <h2>Assignment Completion Date</h2>
        <p>October 20, 2026</p>
    </footer>

</body>
</html>
